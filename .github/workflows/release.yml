name: Release

on:
  push:
    tags: ["v*"]
  # Choose the existing release tag in the Run workflow ref selector.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Require a release tag
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF_TYPE" = tag

  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      MAVEN_REPOSITORY: https://maven.pkg.github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-release-${{ hashFiles('build.mill', 'mill') }}
      - name: Tag, validated commit, versions and com.worxbend coordinates agree
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: python3 .github/scripts/validate-release.py
      - name: Publish libraries to GitHub Packages
        timeout-minutes: 25
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mill mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts '{core,client,backend-zio,backend-okhttp}.publishArtifacts' \
            --releaseUri "$MAVEN_REPOSITORY" --snapshotUri "$MAVEN_REPOSITORY"
      - name: Verify every GitHub Packages POM and jar
        timeout-minutes: 10
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/verify-published.py "$MAVEN_REPOSITORY"
      - name: Stage release jars
        run: ./mill '{core,client,backend-zio,backend-okhttp}.publishM2Local' --m-2-repo-path "$RUNNER_TEMP/staging-m2"
      - name: Attach jars to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$RUNNER_TEMP/staging-m2/com/worxbend" -type f -name '*.jar' | sort)
          test "${#jars[@]}" = 12
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" "${jars[@]}" --clobber
